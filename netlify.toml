[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"

# The service worker and the manifest are re-checked on every visit, so a new
# deploy reaches installed copies. The hashed files in /assets stay cacheable.
[[headers]]
  for = "/sw.js"
    [headers.values]
      Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
    [headers.values]
      Content-Type = "application/manifest+json"
      Cache-Control = "no-cache"
